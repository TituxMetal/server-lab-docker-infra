services:
  hbbs:
    container_name: 'rustdesk-id-${RUSTDESK_INSTANCE:?RUSTDESK_INSTANCE is required}'
    image: rustdesk/rustdesk-server:1.1.16
    ports:
      - '21115:21115'
      - '21116:21116'
      - '21116:21116/udp'
      - '21118:21118'
    volumes:
      - rustdesk-data:/root
    # No `-k` here on purpose: hbbs only loads id_ed25519 from /root when `-k`
    # is empty, "-" or a 64-byte secret. Passing the public key makes hbbs run
    # without a signing key and clients that already trust that key break.
    # The private key must already be in the volume (see example.env).
    command: 'hbbs -r ${RUSTDESK_RELAY_HOST:?RUSTDESK_RELAY_HOST is required}:21117'
    networks:
      - rustdesk-nw
      - default-nw
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: 'rustdesk-relay-${RUSTDESK_INSTANCE:?RUSTDESK_INSTANCE is required}'
    image: rustdesk/rustdesk-server:1.1.16
    # hbbr only uses the key as an opaque string: clients must send the same
    # public key in their relay request, otherwise the relay is open to anyone.
    command: 'hbbr -k ${RUSTDESK_KEY:?RUSTDESK_KEY is required}'
    ports:
      - '21117:21117'
      - '21119:21119'
    volumes:
      - rustdesk-data:/root
    networks:
      - rustdesk-nw
      - default-nw
    restart: unless-stopped

volumes:
  rustdesk-data:
    # Fixed name: the volume carries the server key pair and must keep the same
    # name across compose project renames (manual, Arcane, another host).
    name: rustdesk-data

networks:
  default-nw:
    external: true
  rustdesk-nw:
    external: false
