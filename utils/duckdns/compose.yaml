services:
  duckdns:
    image: linuxserver/duckdns:version-8f533707
    container_name: 'duckdns-${HOSTNAME}'
    environment:
      - TZ=Europe/Paris
      - SUBDOMAINS=$SUBDOMAINS
      - TOKEN=$TOKEN
      - UPDATE_IP=ipv4
      - PUID=1000
      - PGID=1000
      - LOG_FILE=true
    networks:
      - default-nw
    restart: unless-stopped

networks:
  default-nw:
    external: true
