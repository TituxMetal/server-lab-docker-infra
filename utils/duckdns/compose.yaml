services:
  duckdns:
    image: linuxserver/duckdns:version-8f533707
    container_name: 'duckdns-${HOSTNAME}'
    environment:
      - TZ=Europe/Paris
      - SUBDOMAINS=$SUBDOMAINS
      - TOKEN=$TOKEN
      - UPDATE_IP=ipv4
      - PUID=1000
      - PGID=1000
      - LOG_FILE=true
    networks:
      - default-nw
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  default-nw:
    external: true
