services:
  nginx-proxy-manager:
    container_name: 'nginx-proxy-manager-${HOSTNAME}'
    image: 'jc21/nginx-proxy-manager:2.16.0'
    environment:
      TZ: 'Europe/Paris'
    ports:
      - '80:80'
      - '443:443'
      # Localhost only. Note: NPM still listens on 0.0.0.0:81 inside the
      # container, so a proxy host pointing at port 81 would publish the admin
      # panel through 80/443. Use an SSH tunnel instead.
      - '127.0.0.1:81:81'
    volumes:
      - '/srv/nginx-proxy-manager/data:/data'
      - '/srv/logs/nginx-proxy-manager:/data/logs/'
      - '/srv/nginx-proxy-manager/data/letsencrypt:/etc/letsencrypt'
    networks:
      - reverse-proxy-nw
      - default-nw
    restart: unless-stopped

  main-site:
    container_name: 'main-site-${HOSTNAME}'
    image: 'lgdweb/nginx-test:latest'
    volumes:
      - '/srv/logs/nginx:/var/log/nginx'
      - '/etc/localtime:/etc/localtime:ro'
      - '/etc/timezone:/etc/timezone:ro'
    networks:
      - reverse-proxy-nw
      - default-nw

networks:
  default-nw:
    external: true
  reverse-proxy-nw:
    external: true
