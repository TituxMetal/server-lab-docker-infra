services:
  fail2ban:
    container_name: 'fail2ban-${HOSTNAME}'
    image: 'crazymax/fail2ban:1.1.1'
    environment:
      # The entrypoint only reads TZ, F2B_LOG_TARGET, F2B_LOG_LEVEL,
      # F2B_DB_PURGE_AGE and IPTABLES_MODE. F2B_ACTION, F2B_DEST_EMAIL and
      # F2B_IPTABLES_CHAIN were never read: `action`, `destemail` and the ban
      # chain come from fail2ban/data/jail.d/*.conf and action.d/iptables-docker.conf.
      # No SMTP sidecar: mail leaves through the host MTA on 127.0.0.1:25
      # (exim4, installed by roles/exim/config in the ansible repository). The
      # previous msmtpd published no port at all, so this host-network container
      # could never reach it.
      TZ: 'Europe/Paris'
      F2B_LOG_TARGET: '/srv/logs/fail2ban/fail2ban.log'
      F2B_LOG_LEVEL: 'INFO'
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - '/srv/fail2ban/data:/data'
      - '/srv/logs:/srv/logs'
      - '/var/log:/var/log:ro'
    cap_add:
      - NET_ADMIN
      - NET_RAW
